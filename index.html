<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Micro:bit → ThingSpeak</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="dashboard.css">
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin:0; background:#f6f7f8; color:#1f2328; }
    main { max-width:720px; margin:0 auto; padding:24px; }
    .card { background:#fff; border:1px solid #ddd; border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 2px 10px rgba(0,0,0,.04); }
    h1 { margin:0 0 6px; font-size:1.6rem; }
    .muted { color:#667085; }
    .status { font-size:1.1rem; font-weight:700; margin-bottom:6px; }
    button { font:inherit; padding:10px 14px; border-radius:10px; border:1px solid #bbb; background:#fff; cursor:pointer; margin:4px 6px 4px 0; }
    button.primary { background:#111827; color:#fff; border-color:#111827; }
    input { font:inherit; width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #bbb; border-radius:10px; }
    label { display:block; font-weight:600; margin-bottom:6px; }
    .grid { display:grid; gap:12px; }
    .ok { color:#067647; }
    .warn { color:#b54708; }
    .err { color:#b42318; }
    code { background:#f2f4f7; padding:2px 5px; border-radius:5px; }
    #log { white-space:pre-wrap; font-family:ui-monospace, SFMono-Regular, Consolas, monospace; font-size:.9rem; max-height:160px; overflow:auto; background:#f8fafc; padding:10px; border-radius:10px; }
  </style>
</head>
<body>
<main>
  <section class="card">
    <h1>Micro:bit → ThingSpeak</h1>
    <div class="muted">Gateway per Chrome i ChromeOS amb Web Serial</div>
  </section>

  <section class="card">
    <div id="status" class="status">Preparant…</div>
    <div id="detail" class="muted">Comprovant compatibilitat.</div>
  </section>

  <section class="card grid">
    <div>
      <label for="apiKey">ThingSpeak Write API Key</label>
      <input id="apiKey" type="password" autocomplete="off" placeholder="Enganxa la Write API Key">
    </div>
    <div>
      <button id="saveKey">Desa clau</button>
      <button id="connect" class="primary">Connecta micro:bit</button>
      <button id="disconnect">Desconnecta</button>
    </div>
    <div class="muted">
      La clau es desa només en aquest navegador. Els gràfics són locals i es poden configurar. La micro:bit receptora ha d'enviar línies com
      <code>23,157,623</code>.
    </div>
  </section>

  <section class="card">
    <strong>Últimes dades</strong>
    <div id="lastData" class="muted" style="margin-top:6px">Encara no hi ha dades.</div>
  </section>

  <section id="sensorDashboard" class="card" aria-label="Observatori de sensors"></section>

  <section class="card">
    <strong>Registre</strong>
    <div id="log" style="margin-top:8px"></div>
  </section>

  <script src="dashboard.js"></script>
  <script src="app.js"></script>
</main>
</body>
</html>
