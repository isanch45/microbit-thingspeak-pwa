<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Micro:bit → ThingSpeak</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="dashboard.css">
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin:0; background:#f6f7f8; color:#1f2328; }
    main { max-width:720px; margin:0 auto; padding:24px; }
    .card { background:#fff; border:1px solid #ddd; border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 2px 10px rgba(0,0,0,.04); }
    h1 { margin:0 0 6px; font-size:1.6rem; }
    .muted { color:#667085; }
    .status { font-size:1.1rem; font-weight:700; margin-bottom:6px; }
    button { font:inherit; padding:10px 14px; border-radius:10px; border:1px solid #bbb; background:#fff; cursor:pointer; margin:4px 6px 4px 0; }
    button.primary { background:#111827; color:#fff; border-color:#111827; }
    input { font:inherit; width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #bbb; border-radius:10px; }
    label { display:block; font-weight:600; margin-bottom:6px; }
    .grid { display:grid; gap:12px; }
    .ok { color:#067647; }
    .warn { color:#b54708; }
    .err { color:#b42318; }
    code { background:#f2f4f7; padding:2px 5px; border-radius:5px; }
    #log { white-space:pre-wrap; font-family:ui-monospace, SFMono-Regular, Consolas, monospace; font-size:.9rem; max-height:160px; overflow:auto; background:#f8fafc; padding:10px; border-radius:10px; }
  </style>
</head>
<body>
<main>
  <header class="app-header">
    <span class="app-brand-mark" aria-hidden="true">◉</span>
    <div>
      <h1>Micro:bit → ThingSpeak</h1>
      <p>Observatori de sensors</p>
    </div>
  </header>

  <div class="app-layout">
    <aside class="app-sidebar" aria-label="Connexió i enviament de dades">
      <section class="card sidebar-status" aria-live="polite">
        <div class="sidebar-label">Estat</div>
        <div id="status" class="status">Preparant…</div>
        <div id="detail" class="muted">Comprovant compatibilitat.</div>
      </section>

      <section class="card sidebar-connection">
        <div class="sidebar-label">Connexió</div>
        <button id="connect" class="primary side-connect">Connecta micro:bit</button>
        <button id="disconnect" class="side-disconnect">Desconnecta</button>
        <div class="wake-control">
          <label class="wake-toggle" for="keepAwake">
            <input type="checkbox" id="keepAwake" checked>
            <span>Evita la suspensió</span>
          </label>
          <div id="wakeLockStatus" class="wake-status" aria-live="polite">Comprovant…</div>
        </div>
        <div class="sidebar-key">
          <label for="apiKey">Write API Key</label>
          <input id="apiKey" type="password" autocomplete="off" placeholder="Clau de ThingSpeak">
          <button id="saveKey">Desa la clau</button>
        </div>
      </section>

      <section class="card sidebar-recent">
        <div class="sidebar-label">Última lectura rebuda</div>
        <div id="lastData" class="muted">Encara no hi ha dades.</div>
      </section>

      <section class="card sidebar-sent" aria-label="Últim enviament a ThingSpeak">
        <div class="sidebar-label">Últim enviament a ThingSpeak</div>
        <div id="lastSentData" class="sent-fields">Encara no s'ha enviat cap dada.</div>
        <div id="lastSentTime" class="sent-time"></div>
        <div id="lastSentStatus" class="sent-status" aria-live="polite"></div>
      </section>

      <details class="card sidebar-log">
        <summary>Registre de comunicació</summary>
        <div id="log" aria-live="off"></div>
      </details>
    </aside>

    <section id="sensorDashboard" class="card charts-panel" aria-label="Gràfics de sensors"></section>
  </div>

  <script src="chart-options.js"></script>
  <script src="chart-options-dialog.js"></script>
  <script src="dashboard.js"></script>
  <script src="wake-lock.js"></script>
  <script src="app.js"></script>
</main>
</body>
</html>
